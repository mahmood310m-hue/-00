<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدرسة كوثر الأهلية - بوابة الطالب والإدارة</title>
    <!-- استيراد خط تجوال -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- FontAwesome للأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #F4F6F4;
            --card-bg: #FFFFFF;
            --primary-sage: #6B8E7B;
            --sage-light: #E8F0EC;
            --walnut: #5C4033;
            --charcoal: #2C3531;
            --accent-gold: #D4AF37;
            --text-main: #2C3531;
            --text-muted: #707A75;
            --danger: #d9534f;
            --radius: 16px;
            --shadow: 0 4px 20px rgba(107, 142, 123, 0.08);
            --transition: all 0.3s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            min-height: 100vh;
            flex-direction: row;
        }

        /* Sidebar Navigation - متوافق مع الهاتف والشاشات الكبيرة */
        aside {
            width: 260px;
            background-color: var(--card-bg);
            border-left: 1px solid var(--sage-light);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            position: fixed;
            height: 100vh;
            z-index: 100;
            top: 0;
            right: 0;
            overflow-y: auto;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 25px;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background-color: var(--sage-light);
            color: var(--primary-sage);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .logo-text h2 {
            font-size: 15px;
            font-weight: 700;
            color: var(--charcoal);
        }

        .logo-text span {
            font-size: 11px;
            color: var(--text-muted);
        }

        .nav-links {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex-grow: 1;
        }

        .nav-links li a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            color: var(--text-muted);
            text-decoration: none;
            border-radius: 10px;
            font-weight: 500;
            font-size: 14px;
            transition: var(--transition);
        }

        .nav-links li.active a, .nav-links li a:hover {
            background-color: var(--sage-light);
            color: var(--primary-sage);
        }

        /* زر الإدارة مثبت أسفل القائمة */
        .admin-section {
            margin-top: auto;
            padding-top: 15px;
            border-top: 1px solid var(--sage-light);
        }

        .admin-btn a {
            color: var(--walnut) !important;
            font-weight: 700 !important;
            background-color: #FDF8F3;
            border: 1px dashed var(--walnut);
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            text-decoration: none;
            border-radius: 10px;
            font-size: 14px;
        }

        /* Main Content */
        main {
            margin-right: 260px;
            flex-grow: 1;
            padding: 20px;
            max-width: 1200px;
            width: calc(100% - 260px);
        }

        header {
            display: flex;
            justify-content: space-between;
