<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدرسة كوثر الأهلية - بوابة الطالب والإدارة</title>
    <!-- استيراد خط تجوال -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- FontAwesome للأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #F4F6F4;
            --card-bg: #FFFFFF;
            --primary-sage: #6B8E7B;
            --sage-light: #E8F0EC;
            --walnut: #5C4033;
            --charcoal: #2C3531;
            --accent-gold: #D4AF37;
            --text-main: #2C3531;
            --text-muted: #707A75;
            --danger: #d9534f;
            --radius: 16px;
            --shadow: 0 4px 20px rgba(107, 142, 123, 0.08);
            --transition: all 0.3s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar Navigation */
        aside {
            width: 260px;
            background-color: var(--card-bg);
            border-left: 1px solid var(--sage-light);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px;
            position: fixed;
            height: 100vh;
            z-index: 100;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 40px;
        }

        .logo-icon {
            width: 45px;
            height: 45px;
            background-color: var(--sage-light);
            color: var(--primary-sage);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }

        .logo-text h2 {
            font-size: 16px;
            font-weight: 700;
            color: var(--charcoal);
        }

        .logo-text span {
            font-size: 12px;
            color: var(--text-muted);
        }

        .nav-links {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-grow: 1;
        }

        .nav-links li a {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 16px;
            color: var(--text-muted);
            text-decoration: none;
            border-radius: 12px;
            font-weight: 500;
            transition: var(--transition);
        }

        .nav-links li.active a, .nav-links li a:hover {
            background-color: var(--sage-light);
            color: var(--primary-sage);
        }

        .admin-btn a {
            color: var(--walnut) !important;
            font-weight: 700 !important;
            background-color: #FDF8F3;
            border: 1px dashed var(--walnut);
        }

        /* Main Content */
        main {
            margin-right: 260px;
            flex-grow: 1;
            padding: 30px;
            max-width: 1200px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .welcome-msg h1 {
            font-size: 24px;
            color: var(--charcoal);
            font-weight: 700;
        }

        .welcome-msg p {
            color: var(--text-muted);
            font-size: 14px;
            margin-top: 4px;
        }

        .user-profile-mini {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--card-bg);
            padding: 8px 16px;
            border-radius: 30px;
            box-shadow: var(--shadow);
        }

        .user-profile-mini img {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
        }

        /* Views / Sections */
        .view-section {
            display: none;
        }

        .view-section.active {
            display: block;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Dashboard Grid */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background-color: var(--card-bg);
            padding: 24px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid rgba(107, 142, 123, 0.1);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .card-header h3 {
            font-size: 16px;
            color: var(--charcoal);
            font-weight: 600;
        }

        .card-header i {
            color: var(--primary-sage);
            font-size: 20px;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: var(--primary-sage);
        }

        /* Forms */
        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: var(--charcoal);
            font-weight: 500;
        }
